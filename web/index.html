<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옥포 빈 점포 지도</title>
<meta name="description" content="거제 옥포 상권 3D 지도 — 동남권에서 공실률이 가장 높은 상권">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="c" aria-label="거제 옥포 3D 지도"></canvas>
<div id="labels" aria-hidden="true"></div>

<!-- 요약 카드: 숫자는 모두 web/data/okpo_stats.js(R-ONE 원자료에서 자동 생성) -->
<section id="card" aria-labelledby="card-title">
  <div class="card-head">
    <h1 id="card-title"><span id="s-label">거제 옥포</span> 상권<span class="mini" id="s-mini"></span></h1>
    <button id="card-toggle" class="icon-btn" aria-expanded="true" aria-controls="card-body" title="접기">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="card-body">
    <div class="big">
      <span class="big-num" id="s-general">–</span><span class="big-unit">%</span>
      <span class="badge" id="s-rank"></span>
    </div>
    <p class="big-cap">상가 공실률(건물 전체) · <span id="s-quarter"></span></p>
    <dl class="kv">
      <div><dt>큰 건물(중대형)</dt><dd id="s-large">–</dd></div>
      <div><dt>2년 전</dt><dd id="s-before">–</dd></div>
    </dl>
    <figure class="spark">
      <svg id="s-chart" viewBox="0 0 280 96" role="img" aria-label="공실률 2년 추이"></svg>
      <figcaption id="s-legend"></figcaption>
    </figure>
    <p class="src">출처: <span id="s-src"></span></p>
  </div>
</section>

<!-- 보기 설정 -->
<section id="layers" aria-label="보기 설정">
  <label class="tog"><input type="checkbox" id="L-est"><span>층수 추정 건물 표시</span></label>
  <label class="tog"><input type="checkbox" id="L-names" checked><span>지명</span></label>
  <label class="tog"><input type="checkbox" id="L-roads" checked><span>도로 이름</span></label>
</section>

<!-- 건물 정보 -->
<aside id="info" aria-live="polite" hidden>
  <div class="info-head">
    <h2 id="i-title"></h2>
    <button id="i-close" class="icon-btn" aria-label="닫기" title="닫기">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="i-body"></div>
</aside>

<nav id="nav" aria-label="지도 조작">
  <button data-n="l" aria-label="왼쪽으로 돌리기" title="왼쪽으로 돌리기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6H4V3M4.6 6A7 7 0 1 1 3 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-n="r" aria-label="오른쪽으로 돌리기" title="오른쪽으로 돌리기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 6h3V3M15.4 6A7 7 0 1 0 17 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-n="u" aria-label="위에서 내려다보기" title="위에서 내려다보기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-n="d" aria-label="옆에서 보기" title="옆에서 보기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-n="h" aria-label="처음 위치로" title="처음 위치로"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5L10 4l7 5.5M5.5 8v8h9V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</nav>

<p id="hint">끌기: 옮기기 · 오른쪽 끌기: 돌리기 · 휠: 확대 · 건물을 누르면 층별 정보</p>
<footer id="credit">지도 © OpenStreetMap 기여자(ODbL) · 공실률 한국부동산원 R-ONE</footer>
<div id="loading" role="status">지도를 그리는 중…</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/BufferGeometryUtils.js"></script>
<script src="data/okpo_map.js"></script>
<script src="data/okpo_stats.js"></script>
<script src="data/okpo_floors.js"></script>
<script src="app.js"></script>
<script src="data/okpo_sim.js"></script>
<script src="data/okpo_persona.js"></script>
<script src="floors.js"></script>
<script src="data/okpo_street.js"></script>
<script src="sim.js"></script>
<script src="street.js"></script>
</body>
</html>
